[build]
  publish = "."
  functions = "netlify/functions"

# Template files are bundled into the download functions only, so they can
# only be fetched after a verified payment.
[functions.download]
  included_files = ["deliverables/**"]

[functions.verify-payment]
  included_files = ["deliverables/**"]

# Keep purchased files and server code from being fetched directly.
[[redirects]]
  from = "/deliverables/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
